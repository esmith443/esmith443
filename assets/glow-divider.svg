<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="presentation">
  <defs>
    <!-- Hairline that glows violet at its centre, transparent at both ends so it
         reads correctly on either the light or dark GitHub background. The soft
         band underneath is what makes it glow rather than just being a rule. -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8d7bf2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a897ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8d7bf2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8d7bf2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8d7bf2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8d7bf2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect x="0" y="4" width="1200" height="4" fill="url(#halo)" filter="url(#soft)"/>
  <rect x="0" y="5.5" width="1200" height="1.6" fill="url(#line)"/>
</svg>
