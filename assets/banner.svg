<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="esmith443 - Windows tooling, Rust plugins, Discord bots, homelab">
  <title>esmith443</title>

  <style>
    /* Soft, slow drift on the glows only. The type never moves. */
    .glow-a {
      transform-origin: 600px 0px;
      animation: drift-a 16s ease-in-out infinite alternate;
    }
    .glow-b {
      transform-origin: 960px 24px;
      animation: drift-b 21s ease-in-out infinite alternate;
    }
    .hair {
      animation: breathe 9s ease-in-out infinite alternate;
    }

    @keyframes drift-a {
      from { opacity: 0.75; transform: translateX(-26px) scale(0.96); }
      to   { opacity: 1;    transform: translateX(26px)  scale(1.09); }
    }
    @keyframes drift-b {
      from { opacity: 0.45; transform: translateX(18px) scale(1.06); }
      to   { opacity: 1;    transform: translateX(-22px) scale(0.94); }
    }
    @keyframes breathe {
      from { opacity: 0.55; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow-a, .glow-b, .hair { animation: none; }
    }
  </style>

  <defs>
    <!-- Base: layered darkness. Lighter violet-navy at the top centre falling to
         near-black, never flat and never pure black. -->
    <radialGradient id="base" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#131022"/>
      <stop offset="62%" stop-color="#050408"/>
      <stop offset="100%" stop-color="#050408"/>
    </radialGradient>

    <!-- The one glowing moment. userSpaceOnUse pins the gradient to the banner's
         own coordinates, so the oversized host rect (needed so the drift never
         exposes an edge) cannot re-map and wash it out. -->
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="600" cy="14" r="600">
      <stop offset="0%" stop-color="#8d7bf2" stop-opacity="0.40"/>
      <stop offset="45%" stop-color="#8d7bf2" stop-opacity="0.13"/>
      <stop offset="75%" stop-color="#8d7bf2" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary, weaker glow off to one side for asymmetry. -->
    <radialGradient id="glow2" gradientUnits="userSpaceOnUse" cx="960" cy="26" r="340">
      <stop offset="0%" stop-color="#b87cf7" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#b87cf7" stop-opacity="0"/>
    </radialGradient>

    <!-- Heading ink: off-white falling to translucent. -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="40%" stop-color="#f6f5fa"/>
      <stop offset="100%" stop-color="#f6f5fa" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Hairline that glows at its centre. -->
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8d7bf2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8d7bf2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8d7bf2" stop-opacity="0"/>
    </linearGradient>

    <!-- Grain, to kill gradient banding and add material. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="240"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="240" fill="url(#base)"/>

    <!-- Oversized so the drift never exposes an edge. -->
    <rect class="glow-a" x="-180" y="-160" width="1560" height="560" fill="url(#glow)"/>
    <ellipse class="glow-b" cx="960" cy="24" rx="330" ry="210" fill="url(#glow2)"/>

    <rect width="1200" height="240" filter="url(#grain)" opacity="0.035"/>

    <!-- 1px top-edge light -->
    <rect width="1200" height="1" fill="#ffffff" opacity="0.10"/>

    <text x="600" y="120" text-anchor="middle" fill="url(#ink)"
          font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="68" font-weight="600" letter-spacing="-1.6">esmith443</text>

    <text x="600" y="160" text-anchor="middle" fill="#9a96a8"
          font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="17" letter-spacing="0.4">Windows tooling  ·  Rust plugins  ·  Discord bots  ·  homelab</text>

    <rect class="hair" x="0" y="239" width="1200" height="1" fill="url(#hair)"/>
  </g>
</svg>
